<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231565a8'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23f2b705' stroke-width='3'/%3E%3Cpath d='M16 4v6M16 22v6M4 16h6M22 16h6' stroke='%23f2b705' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <div class="topstrip">
      <span id="brand-sub">Loading…</span>
      <span class="hud"><b id="hud-lv">LV 1</b><span id="hud-rank">Rookie</span><span class="bar thin"><span id="side-bar" style="width:0%"></span></span><span id="side-pct">0 / 100 XP</span><span id="hud-streak" title="Streak: consecutive days with anything logged">🔥 0</span><span id="hud-hp" title="HP: every overdue re-solve costs 10">❤ 100</span></span>
      <span class="ts-save"><span class="save-state" id="save-state">●</span><span id="save-text">Not linked</span></span>
    </div>

    <header class="topbar">
      <div class="tb-in" id="tabs">
        <button class="brand" data-view="dashboard" aria-label="DSA Tracker — go to Today">
          <span class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"/></svg></span>
          <span>
            <span class="brand-title" style="display:block">DSA Voyage</span>
            <span class="brand-sub">Set sail for Google · January</span>
          </span>
        </button>

        <nav class="nav" aria-label="Pages">
          <button class="nav-item active" data-view="dashboard">Today</button>
          <button class="nav-item" data-view="roadmap">Plan</button>
          <button class="nav-item" data-view="revision">Revision <span class="pill zero" id="pill-due">0</span></button>
          <button class="nav-item" data-view="drills">Drills</button>
          <button class="nav-item" data-view="notes">Notes</button>
          <button class="nav-item" data-view="guide">Guide</button>
        </nav>

        <div class="tb-right">
          <button class="nav-item" data-view="settings">Settings</button>
        </div>
      </div>
    </header>

    <div class="content">
      <div id="banner" class="banner" hidden></div>
      <div id="gate" class="gate" hidden></div>
      <main id="app" hidden>
        <section id="view-dashboard" class="view active"></section>
        <section id="view-roadmap" class="view"></section>
        <section id="view-revision" class="view"></section>
        <section id="view-drills" class="view"></section>
        <section id="view-notes" class="view"></section>
        <section id="view-guide" class="view"></section>
        <section id="view-settings" class="view"></section>
      </main>
      <footer class="footer"><div class="f-in"><span>DSA Voyage · show up, do the list, raise the bounty</span><span>Everything is stored in data.json next to this page</span></div></footer>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
